name: Setup
description: Install pnpm, Node from .nvmrc, and the workspace dependencies.

inputs:
  registry-url:
    description: npm registry to configure for publishing.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    - run: pnpm install --frozen-lockfile
      shell: bash
