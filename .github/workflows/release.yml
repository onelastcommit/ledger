name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:unit

      - run: pnpm run test:integration
        env:
          DATABASE_URL: postgres://ledger:ledger@localhost:5432/ledger_test

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/ledger/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package version $PKG" >&2
            exit 1
          fi

      - name: Pack and verify the tarball
        run: |
          pnpm --filter @1percentlabs/ledger pack --pack-destination /tmp
          VERSION=$(node -p "require('./packages/ledger/package.json').version")
          TARBALL="/tmp/1percentlabs-ledger-$VERSION.tgz"
          echo "Contents of $TARBALL:"
          tar -tzf "$TARBALL"
          for REQUIRED in \
            package/dist/index.js \
            package/dist/index.d.ts \
            package/dist/migrations/001_init.sql \
            package/dist/migrations/002_subscription_failures.sql
          do
            if ! tar -tzf "$TARBALL" | grep -qx "$REQUIRED"; then
              echo "Missing from the tarball: $REQUIRED" >&2
              exit 1
            fi
          done

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm --filter @1percentlabs/ledger publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
